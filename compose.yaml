# Hardened containers (PROPOSAL section 7): read-only root file system, no extra privileges or
# capabilities, non-root users. compose.server.yaml builds on this file, so the server gets the same.
x-hardened: &hardened
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:17
    restart: unless-stopped
    <<: *hardened
    # Runs as the image's postgres user from the start, so the entrypoint needs no root rights.
    user: postgres
    tmpfs: [/tmp, /var/run/postgresql]
    # No published port: only the app reaches the database, over the Compose network.
    environment:
      POSTGRES_DB: metrics
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics -d metrics"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    <<: *hardened
    tmpfs: [/tmp]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://metrics:${POSTGRES_PASSWORD}@db:5432/metrics
      INSTANCE_DIR: /instance
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_LIST_ID: ${SLACK_LIST_ID:-}
      SLACK_PROJECT_LIST_ID: ${SLACK_PROJECT_LIST_ID:-}
      AUTH_MODE: ${AUTH_MODE:-password}
      TEAM_PASSWORD_HASH: ${TEAM_PASSWORD_HASH:-}
      ALLOW_PASSWORD_LOGIN: ${ALLOW_PASSWORD_LOGIN:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_GROUP: ${OIDC_ALLOWED_GROUP:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Optional: the public front page on its own address (WM-154); empty: one address for all.
      FRONT_URL: ${FRONT_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # The course calendar (WM-110); without CALDAV_URL planning runs without a calendar.
      CALDAV_URL: ${CALDAV_URL:-}
      CALDAV_USERNAME: ${CALDAV_USERNAME:-}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD:-}
      CALDAV_ORGANIZER: ${CALDAV_ORGANIZER:-}
      # Kimai (WM-142), for `metrics kimai-check`; the scheduler reads it every hour.
      KIMAI_URL: ${KIMAI_URL:-}
      KIMAI_TOKEN: ${KIMAI_TOKEN:-}
    volumes:
      # Private, organisation-specific config and theme (see instance.example/).
      - ${INSTANCE_DIR:-./instance.example}:/instance:ro
      # Legacy CSV files, only needed for `metrics load-legacy`.
      - ${LEGACY_DATA_DIR:-./tests/fixtures}:/legacy:ro
    ports:
      # Bound to localhost by default; set APP_BIND to expose it on another interface.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"

  # Stage moves, hints, the calendar check, Kimai, Slack messages and the nightly pg_dump (metrics/scheduler.py). It writes only to the backup
  # directory, which must exist and be writable by the image's user (uid 10001), see ops/DEPLOY.md.
  scheduler:
    build: .
    restart: unless-stopped
    <<: *hardened
    tmpfs: [/tmp]
    command: ["metrics", "scheduler"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://metrics:${POSTGRES_PASSWORD}@db:5432/metrics
      BACKUP_DIR: /backups
      INSTANCE_DIR: /instance
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Slack messages (WM-130): off without the token, each switched on in [messages] of the instance.
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      CALDAV_URL: ${CALDAV_URL:-}
      CALDAV_USERNAME: ${CALDAV_USERNAME:-}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD:-}
      CALDAV_ORGANIZER: ${CALDAV_ORGANIZER:-}
      # Absences and weekly hours from Kimai (WM-142): off without both.
      KIMAI_URL: ${KIMAI_URL:-}
      KIMAI_TOKEN: ${KIMAI_TOKEN:-}
    volumes:
      - ${BACKUP_DIR:-./backups/nightly}:/backups
      - ${INSTANCE_DIR:-./instance.example}:/instance:ro
    # Time to finish a running dump after SIGTERM.
    stop_grace_period: 2m

volumes:
  pgdata:
