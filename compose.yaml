# Hardened containers (PROPOSAL section 7): read-only root file system, no extra privileges or
# capabilities, non-root users. compose.server.yaml builds on this file, so the server gets the same.
x-hardened: &hardened
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:17
    restart: unless-stopped
    <<: *hardened
    # Runs as the image's postgres user from the start, so the entrypoint needs no root rights.
    user: postgres
    tmpfs: [/tmp, /var/run/postgresql]
    # No published port: only the app reaches the database, over the Compose network.
    environment:
      POSTGRES_DB: metrics
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics -d metrics"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    <<: *hardened
    tmpfs: [/tmp]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://metrics:${POSTGRES_PASSWORD}@db:5432/metrics
      INSTANCE_DIR: /instance
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_LIST_ID: ${SLACK_LIST_ID:-}
      SLACK_PROJECT_LIST_ID: ${SLACK_PROJECT_LIST_ID:-}
      AUTH_MODE: ${AUTH_MODE:-password}
      TEAM_PASSWORD_HASH: ${TEAM_PASSWORD_HASH:-}
      ALLOW_PASSWORD_LOGIN: ${ALLOW_PASSWORD_LOGIN:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_GROUP: ${OIDC_ALLOWED_GROUP:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Planning prototype: its own SQLite database (never the metrics database) and calendar.
      PLANNING_DATABASE_URL: sqlite:////data/planung-prototyp.sqlite
      CALDAV_URL: ${CALDAV_URL:-}
      CALDAV_USERNAME: ${CALDAV_USERNAME:-}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD:-}
    volumes:
      # Private, organisation-specific config and theme (see instance.example/).
      - ${INSTANCE_DIR:-./instance.example}:/instance:ro
      # Legacy CSV files, only needed for `metrics load-legacy`.
      - ${LEGACY_DATA_DIR:-./tests/fixtures}:/legacy:ro
      # Planning prototype database.
      - planning:/data
    ports:
      # Bound to localhost by default; set APP_BIND to expose it on another interface.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"

volumes:
  pgdata:
  planning:
