# Tests and lint on every push and pull request. Uses only the synthetic fixtures and
# instance.example/; no secrets. The database tests run against a throwaway PostgreSQL.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.13 = the Docker image (production), 3.14 = current development machines.
        python: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # The tests create their own database on this server and drop it afterwards.
      TEST_DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          # Same uv as the Dockerfile.
          version: "0.11.28"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies from the lock file
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests migrations

      - name: Formatting
        run: uv run ruff format --check src tests migrations

      - name: Tests
        run: uv run pytest

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"

      # The runtime dependencies exactly as locked (the image installs the same set).
      - name: Export the locked dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt

      - name: pip-audit
        run: uvx pip-audit --disable-pip --require-hashes -r requirements.txt
