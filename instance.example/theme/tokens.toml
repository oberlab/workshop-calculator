# Theme tokens (example). Same structure as the neutral default theme.
# Font files are referenced relative to this directory, e.g. "fonts/MyFont-Regular.ttf".

[font]
heading = "ui-monospace, monospace"
body = "system-ui, sans-serif"
files = [
  # { family = "My Font", weight = 400, file = "fonts/MyFont-Regular.ttf" },
]

[color]
text = "#333333"
background = "#ffffff"
border = "#333333"
grid = "#eeeeee"
accent = "#4477aa"
muted = "#777777"
# Roles for hints and stages (optional, these are the defaults): critical = Kritisch, warning =
# Wichtig (used only as a fill, with text in the text colour), success = Durchgeführt. The app derives
# tints, darker text shades and surfaces from these and the colours above (static/style.css).
critical = "#c7326c"
warning = "#fabb3a"
success = "#228833"
# Dark inks (optional) for links and for text on the tints above; each needs at least 4.5:1 on white.
# Left out, they are the role colour mixed with black (these values are exactly that).
accent_ink = "#2c4d6e"
critical_ink = "#8f244e"
warning_ink = "#70541a"
success_ink = "#134b1c"

[chart]
bar_opacity = 0.9

[categories]
# Legend order; the first category is drawn on top of the stack.
order = ["Code", "Engineering", "Science"]

[categories.colors]
Code = "#4477aa"
Engineering = "#ee6677"
Science = "#ccbb44"

[palette]
# Chart series without a category colour take the next colour here that no category uses, in order.
categorical = ["#4477aa", "#ee6677", "#ccbb44", "#228833", "#66ccee", "#aa3377", "#bbbbbb"]

[map]
# Fill of municipalities from few to many sessions (sequential, light to dark); no sessions = grid colour.
gradient = ["#c6dbef", "#6baed6", "#2171b5", "#08306b"]
