# Instance configuration (example). Copy instance.example/ to instance/ and adapt it.

[calendar]
# First month of the school year (8 = 1 August, Bavaria).
school_year_start_month = 8

[target_groups]
# Sessions in these contexts always count as teacher training ("Lehrkräfte").
teacher_contexts = ["Lehrkräftefortbildung"]

[slack]
# Columns of the Slack List that are deliberately not transferred.
ignored_columns = ["Abgerechnet"]

# Slack List column names for each field. Only these columns are transferred.
# The defaults below match the column names the app expects; override as needed.
[slack.columns]
date = "Datum"
course_name = "Kursname"
duration_hours = "Dauer (h)"
location = "Ort"
class_age = "Klassenstufe/\nDurchschnittsalter"
participants_female = "TN :female_sign:"
participants_male = "TN :male_sign:"
category = "Kurskategorie"
context = "Kontext"
session_number = "Terminnummer"
status = "Status"
instructor = "Kursleiter"
# Optional: a user column with further team members (Unterstützung). If the Kursleiter column
# holds several users, the first is the lead and the others support.
# support = "Unterstützung"

# `metrics transfer-slack`: List status -> stage. Built in: "In Planung" and "Geplant" -> Geplant,
# "Bestätigt", "Durchgeführt", "Abgesagt". Items with any other status are skipped and reported.
# [slack.stages]
# "Fixiert" = "Bestätigt"

# `metrics transfer-slack`: a project's own List (List ID in SLACK_PROJECT_LIST_ID), one item per
# session. columns: fields as in [slack.columns] (date is required); defaults: values for fields
# the List has no column for, the same for every item (context is required as column or default);
# origins: municipality = the column(s) with its number of participants (Herkunft).
# Without a status column an item counts as held once its date has passed and participants are
# recorded; otherwise it arrives as Geplant.
# [slack.project_list]
# label = "Projekt-A-Liste"
# ignored_columns = ["Notiz"]
# [slack.project_list.columns]
# date = "Datum"
# participants_female = "Mädchen"
# participants_male = "Jungen"
# [slack.project_list.defaults]
# context = "Projekt A"
# course_name = "Projekt A"
# location = "Makerspace"
# instructor = "U0000000001"
# [slack.project_list.origins]
# "Musterstadt" = "Musterstadt"
# "Beispieldorf" = ["Beispieldorf w", "Beispieldorf m"]

[features]
# Internal ranking of sessions per instructor with Slack profile pictures (needs users:read).
# Shown only on the analysis page (team login).
instructor_ranking = false


# Selected projects, each with its own page in the sidebar (team login): the analysis limited
# to the project's contexts, without the category, target group and context filters.
# slug (optional, default: lowercase title) is the address /projekte/<slug>;
# contexts (optional, default: [title]) are the "Kontext" values that belong to the project.
# participant_municipalities (optional): planning asks for the participants per home municipality.
[[projects]]
title = "Projekt A"
slug = "projekt-a"
contexts = ["Projekt A"]

[map]
# Municipality map on the analysis page: a GeoJSON file with a "name" property per feature.
# German districts: python3 scripts/fetch_municipalities.py <district key> instance/geo/municipalities.geojson
# The example shows three made-up municipalities.
title = "Landkreis Muster"
# Label of the number next to the map (sessions in municipalities not on the map).
outside_label = "Außerhalb des Landkreises"
geojson = "geo/municipalities.geojson"
attribution = "Beispielgeometrie, frei erfunden"

[map.labels]
# Optional shorter names written on the map (official name = label); the seeds keep the official names.
# "Gmund a.Tegernsee" = "Gmund"
