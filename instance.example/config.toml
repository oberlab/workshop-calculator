# Instance configuration (example). Copy instance.example/ to instance/ and adapt it.

[calendar]
# First month of the school year (8 = 1 August, Bavaria).
school_year_start_month = 8

[target_groups]
# Sessions in these contexts always count as teacher training ("Lehrkräfte").
teacher_contexts = ["Lehrkräftefortbildung"]

[slack]
# Columns of the Slack List that are deliberately not transferred.
ignored_columns = ["Abgerechnet"]

# Slack List column names for each field. Only these columns are transferred.
# The defaults below match the column names the app expects; override as needed.
[slack.columns]
date = "Datum"
course_name = "Kursname"
duration_hours = "Dauer (h)"
location = "Ort"
class_age = "Klassenstufe/\nDurchschnittsalter"
participants_female = "TN :female_sign:"
participants_male = "TN :male_sign:"
category = "Kurskategorie"
context = "Kontext"
session_number = "Terminnummer"
status = "Status"
instructor = "Kursleiter"
# Optional: a user column with further team members (Unterstützung). If the Kursleiter column
# holds several users, the first is the lead and the others support.
# support = "Unterstützung"

# `metrics transfer-slack`: List status -> stage. Built in: "In Planung" and "Geplant" -> Geplant,
# "Bestätigt", "Durchgeführt", "Abgesagt". Items with any other status are skipped and reported.
# [slack.stages]
# "Fixiert" = "Bestätigt"

# `metrics transfer-slack`: a project's own List (List ID in SLACK_PROJECT_LIST_ID), one item per
# session. columns: fields as in [slack.columns] (date is required); defaults: values for fields
# the List has no column for, the same for every item (context is required as column or default);
# origins: municipality = the column(s) with its number of participants (Herkunft).
# Without a status column an item counts as held once its date has passed and participants are
# recorded; otherwise it arrives as Geplant.
# [slack.project_list]
# label = "Projekt-A-Liste"
# ignored_columns = ["Notiz"]
# [slack.project_list.columns]
# date = "Datum"
# participants_female = "Mädchen"
# participants_male = "Jungen"
# [slack.project_list.defaults]
# context = "Projekt A"
# course_name = "Projekt A"
# location = "Makerspace"
# instructor = "U0000000001"
# [slack.project_list.origins]
# "Musterstadt" = "Musterstadt"
# "Beispieldorf" = ["Beispieldorf w", "Beispieldorf m"]

[workload]
# Estimated working hours of a Termin on the Team page and in Mein Bereich, per person:
#   lead:    course hours × lead_factor + preparation_factor × course hours + lead_overhead_hours + travel
#   support: course hours × support_factor + support_overhead_hours + travel
# A Format's own fixed hours replace lead_overhead_hours; a place's "Fahrtzeit" is the travel time
# for everyone on the Termin. A course can override each value (course page, "Arbeitszeit"). These are the defaults decided on 2026-11-16.
lead_factor = 1.0
preparation_factor = 0.5
lead_overhead_hours = 1.0
support_factor = 1.0
support_overhead_hours = 0.5

[messages]
# Slack messages of the bot (WM-130), each switched on here; all off by default. Nothing is sent
# without SLACK_BOT_TOKEN (scope chat:write); links need PUBLIC_URL. Each message goes out at most
# once (recorded in the database), only for Termine from Bestätigt on.
# after_course: DM to the Kursleitung 1, 2, 3 and 7 days after a Termin (09:00) while participants
#   or Herkunft are missing, with the link to the phone form.
# reminder: DM to everyone on the team the day before a Termin (15:00): time, place, team.
# weekly_status: Monday 09:00 to `channel` (caught up later that week if missed): this year's
#   Einsätze and Teilnehmende as on the front page, and this week's Termine.
after_course = false
reminder = false
weekly_status = false
# The team channel's ID (Slack: channel details, at the bottom); the bot must be a member.
# channel = "C0000000000"

[privacy]
# The organisation's part of the privacy notice: the short public part (/datenschutz, for visitors and
# the login) and the team part (/datenschutz/team, behind the login). Everything the app does itself
# (what it stores, how long, where data goes, cookies) is written from the code. Missing values show a
# marked placeholder and a notice for admins; without `updated` both parts are marked "Entwurf".
# Multi-line values keep their line breaks. Have the texts checked before setting `updated`.
# Every key is commented out here, so the example shows the placeholders; uncomment and fill in.
# responsible = """
# Musterverein e. V.
# Beispielstraße 1
# 12345 Musterstadt
# """
# contact_email = "datenschutz@example.org"
# Who runs the server and where, and how long its own logs and server backups are kept.
# hosting = "Der Server wird von [Hoster] in [Land] betrieben. [Aufbewahrung der Server-Protokolle und Server-Sicherungen]"
# The legal basis for each group of people (team, contact persons), as the organisation words it.
# Shown in the team part, and in the public part too unless legal_basis_visitors is set.
# legal_basis = "[Rechtsgrundlage je Personengruppe, von der verantwortlichen Stelle geprüft]"
# Optional: a separate wording for visitors of the public pages and the login (public part only).
# legal_basis_visitors = "[Rechtsgrundlage für Besucherinnen und Besucher der öffentlichen Seiten]"
# supervisory_authority = """
# [Name der zuständigen Datenschutz-Aufsichtsbehörde]
# [Anschrift]
# """
# Optional: the data protection officer, if the organisation has one.
# dpo = "[Name, E-Mail-Adresse]"
# The date the checked text applies from; until it is set the page says "Entwurf".
# updated = 2026-12-01

[imprint]
# The Impressum (/impressum, "Angaben gemäß § 5 DDG"). name, address, represented_by, register and
# email are required (else a marked placeholder); phone, vat_id, responsible_content and extra are
# optional. extra is free text (paragraphs separated by an empty line) for anything else the
# organisation wants on the page. Every key is commented out here, so the example shows the placeholders.
# name = "Musterverein e. V."
# address = """
# Beispielstraße 1
# 12345 Musterstadt
# """
# represented_by = "[Vorstand: Namen der vertretungsberechtigten Personen]"
# register = "[Registergericht], [Registernummer]"
# email = "kontakt@example.org"
# phone = "+49 000 000000"
# vat_id = "DE000000000"
# responsible_content = "[Name, Anschrift]"
# extra = """
# [Weitere Angaben der Organisation]
# """

[features]
# Internal ranking of sessions per instructor with Slack profile pictures (needs users:read).
# Shown only on the analysis page (team login).
instructor_ranking = false


# Projects for the first data load: they seed the Kontexte list, which owns the project pages
# afterwards (Stammdaten > Kontexte, "Adresse der Projektseite"); later changes go there.
# Each project gets its own page in the sidebar (team login): the analysis limited
# to the project's contexts, without the category, target group and context filters.
# slug (optional, default: lowercase title) is the address /projekte/<slug>;
# contexts (optional, default: [title]) are the "Kontext" values that belong to the project.
# participant_municipalities (optional): planning asks for the participants per home municipality.
[[projects]]
title = "Projekt A"
slug = "projekt-a"
contexts = ["Projekt A"]

[map]
# Municipality map on the analysis page: a GeoJSON file with a "name" property per feature.
# German districts: python3 scripts/fetch_municipalities.py <district key> instance/geo/municipalities.geojson
# The example shows three made-up municipalities.
title = "Landkreis Muster"
# Label of the number next to the map (sessions in municipalities not on the map).
outside_label = "Außerhalb des Landkreises"
geojson = "geo/municipalities.geojson"
attribution = "Beispielgeometrie, frei erfunden"

[map.labels]
# Optional shorter names written on the map (official name = label); the seeds keep the official names.
# "Gmund a.Tegernsee" = "Gmund"
